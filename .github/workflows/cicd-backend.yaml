name: Deploy Backend to Lambda

on:
  push:
    tags:
      - 'v-backend*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Debug - List repository structure
        run: |
          echo "Current directory:"
          pwd
          echo "Repository contents:"
          ls -la
          echo "Checking for backend folder:"
          if [ -d "inicio/backend" ]; then
            echo "Found: inicio/backend"
            ls -la inicio/backend/ | head -20
          elif [ -d "backend" ]; then
            echo "Found: backend (in root)"
            ls -la backend/ | head -20
          else
            echo "Backend folder not found in expected locations"
            find . -name "backend" -type d 2>/dev/null | head -5
          fi

      - name: Determine backend path
        id: backend-path
        run: |
          if [ -d "inicio/backend" ]; then
            echo "path=inicio/backend" >> $GITHUB_OUTPUT
          elif [ -d "backend" ]; then
            echo "path=backend" >> $GITHUB_OUTPUT
          else
            echo "Error: Backend directory not found"
            exit 1
          fi

      - name: Install all dependencies
        working-directory: ${{ steps.backend-path.outputs.path }}
        run: |
          echo "Installing dependencies in: ${{ steps.backend-path.outputs.path }}"
          # Use npm install to handle lock file updates
          # npm ci requires exact sync between package.json and package-lock.json
          npm install
          echo "✅ All dependencies installed"

      - name: Build TypeScript
        working-directory: ${{ steps.backend-path.outputs.path }}
        run: |
          echo "Building TypeScript..."
          npm run build
          echo "Build completed. Checking dist folder:"
          ls -la dist/ | head -10

      - name: Clean and install production dependencies only
        working-directory: ${{ steps.backend-path.outputs.path }}
        run: |
          echo "Installing production dependencies..."
          echo "Cleaning node_modules..."
          rm -rf node_modules
          
          # Install production dependencies
          echo "Installing with npm..."
          npm install --production --no-save
          
          # Verify bcryptjs installation (no native compilation needed)
          echo "Verifying bcryptjs installation..."
          if [ -f "node_modules/bcryptjs/dist/bcrypt.js" ] || [ -f "node_modules/bcryptjs/index.js" ]; then
            echo "✅ bcryptjs installed successfully (JavaScript implementation, no native compilation needed)"
            ls -la node_modules/bcryptjs/ | head -10
          else
            echo "⚠️  Warning: bcryptjs not found in expected location"
            find node_modules/bcryptjs -type f 2>/dev/null | head -5
          fi
          
          echo "✅ Production dependencies installed"

      - name: Validate AWS secrets and set defaults
        id: aws-config
        run: |
          # Validate required secrets
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "❌ Error: AWS_ACCESS_KEY_ID secret is not configured"
            echo "Please add it in: Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "❌ Error: AWS_SECRET_ACCESS_KEY secret is not configured"
            echo "Please add it in: Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -z "${{ secrets.S3_BUCKET_NAME }}" ]; then
            echo "❌ Error: S3_BUCKET_NAME secret is not configured"
            echo "Please add it in: Settings > Secrets and variables > Actions"
            exit 1
          fi
          
          # Set default region if not provided
          if [ -z "${{ secrets.AWS_REGION }}" ]; then
            echo "⚠️  Warning: AWS_REGION secret is not configured, using default: us-east-1"
            echo "You can override this by setting AWS_REGION secret in: Settings > Secrets and variables > Actions"
            echo "region=us-east-1" >> $GITHUB_OUTPUT
          else
            echo "✅ Using AWS_REGION from secrets: ${{ secrets.AWS_REGION }}"
            echo "region=${{ secrets.AWS_REGION }}" >> $GITHUB_OUTPUT
          fi
          
          # Validate Lambda function name
          if [ -z "${{ secrets.LAMBDA_FUNCTION_NAME }}" ]; then
            echo "❌ Error: LAMBDA_FUNCTION_NAME secret is not configured"
            echo "Please add it in: Settings > Secrets and variables > Actions"
            echo "Example value: peer-tutoring-backend"
            exit 1
          fi
          
          echo "✅ All required AWS secrets are configured"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.aws-config.outputs.region }}

      - name: Get Lambda architecture
        id: lambda-arch
        run: |
          echo "Detecting Lambda function architecture..."
          # Try to get architecture from existing function, default to x86_64
          ARCH=$(aws lambda get-function-configuration \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --region "${{ steps.aws-config.outputs.region }}" \
            --query 'Architectures[0]' \
            --output text 2>/dev/null || echo "x86_64")
          
          # Default to x86_64 if not specified, function doesn't exist, or error
          if [ -z "$ARCH" ] || [ "$ARCH" == "None" ] || [ "$ARCH" == "null" ]; then
            ARCH="x86_64"
            echo "⚠️  Lambda function not found or architecture not set, defaulting to x86_64"
          fi
          
          echo "architecture=$ARCH" >> $GITHUB_OUTPUT
          echo "✅ Detected Lambda architecture: $ARCH"
          echo ""
          echo "ℹ️  Note: If this is the first deployment, architecture defaults to x86_64"
          echo "   You can change it in Lambda console: Configuration > General configuration > Edit > Architecture"

      - name: Rebuild native modules for Lambda architecture
        working-directory: ${{ steps.backend-path.outputs.path }}
        run: |
          LAMBDA_ARCH="${{ steps.lambda-arch.outputs.architecture }}"
          echo "Processing native modules for architecture: $LAMBDA_ARCH"
          
          # If Lambda is arm64, we need to rebuild native modules for arm64
          if [ "$LAMBDA_ARCH" == "arm64" ]; then
            echo "⚠️  Lambda is configured for arm64 architecture"
            echo "Rebuilding native modules for arm64 using Docker..."
            
            # Check if Docker is available
            if ! command -v docker &> /dev/null; then
              echo "❌ Error: Docker is required for arm64 compilation but not available"
              echo "   GitHub Actions runners should have Docker available"
              exit 1
            fi
            
            # Use Docker to compile native modules for arm64
            # Using the official AWS Lambda Node.js 24 base image
            docker run --rm \
              -v "$PWD:/workspace" \
              -w /workspace \
              --platform linux/arm64 \
              public.ecr.aws/lambda/nodejs:24 \
              sh -c "npm rebuild --production" || {
              echo "⚠️  Docker rebuild failed, trying alternative method..."
              # Fallback: use npm with cross-compilation flags
              npm_config_arch=arm64 npm rebuild --production || {
                echo "❌ Error: Failed to rebuild native modules for arm64"
                exit 1
              }
            }
            
            echo "✅ Native modules rebuilt for arm64"
          else
            echo "✅ Native modules compiled for x86_64 (default architecture)"
            echo "   No rebuild needed - GitHub Actions runs on x86_64 Linux"
          fi

      - name: Verify native modules
        working-directory: ${{ steps.backend-path.outputs.path }}
        run: |
          LAMBDA_ARCH="${{ steps.lambda-arch.outputs.architecture }}"
          echo "Verifying native modules for architecture: $LAMBDA_ARCH"
          echo ""
          
          # List of native modules to verify
          # Note: bcryptjs is JavaScript-only, no native compilation needed
          declare -A NATIVE_MODULES=(
          )
          
          ALL_OK=true
          
          for module in "${!NATIVE_MODULES[@]}"; do
            module_path="${NATIVE_MODULES[$module]}"
            full_path="node_modules/$module/$module_path"
            
            echo "Checking $module..."
            if [ -f "$full_path" ]; then
              echo "  ✅ $module: Found at $module_path"
              
              # Check file type
              file_info=$(file "$full_path" 2>/dev/null || echo "unknown")
              echo "  📋 File info: $file_info"
              
              # Verify architecture if arm64
              if [ "$LAMBDA_ARCH" == "arm64" ]; then
                if echo "$file_info" | grep -q "ARM\|aarch64"; then
                  echo "  ✅ Architecture: ARM64 (correct)"
                else
                  echo "  ⚠️  Warning: Expected ARM64 but got: $file_info"
                  echo "  This may cause runtime errors in Lambda"
                fi
              else
                if echo "$file_info" | grep -q "x86-64\|x86_64\|Intel 80386"; then
                  echo "  ✅ Architecture: x86_64 (correct)"
                else
                  echo "  ⚠️  Warning: Expected x86_64 but got: $file_info"
                fi
              fi
            else
              echo "  ❌ $module: NOT FOUND at $module_path"
              echo "  Attempting to find alternative paths..."
              
              # Try to find the module in different locations
              find_result=$(find "node_modules/$module" -name "*.node" 2>/dev/null | head -1)
              if [ -n "$find_result" ]; then
                echo "  ⚠️  Found at alternative path: $find_result"
                file_info=$(file "$find_result" 2>/dev/null || echo "unknown")
                echo "  📋 File info: $file_info"
              else
                echo "  ❌ No .node files found for $module"
                ALL_OK=false
              fi
            fi
            echo ""
          done
          
          # Check for other potential native modules
          echo "Scanning for other native modules..."
          native_count=$(find node_modules -name "*.node" 2>/dev/null | wc -l)
          echo "  Found $native_count native module(s) total"
          
          if [ "$native_count" -gt 0 ]; then
            echo "  Native modules found:"
            find node_modules -name "*.node" 2>/dev/null | head -10 | while read -r file; do
              echo "    - $file"
            done
          fi
          
          echo ""
          if [ "$ALL_OK" = true ]; then
            echo "✅ All native modules verified successfully"
          else
            echo "❌ Some native modules failed verification"
            echo "Attempting to rebuild all native modules..."
            npm rebuild --production
            if [ "$LAMBDA_ARCH" == "arm64" ]; then
              echo "⚠️  Note: If rebuild fails, ensure Docker is available for arm64 compilation"
            fi
            exit 1
          fi

      - name: Create deployment package
        working-directory: ${{ steps.backend-path.outputs.path }}
        run: |
          echo "Creating deployment package for Lambda..."
          
          # Verify lambda-handler exists
          if [ ! -f "dist/lambda-handler.js" ]; then
            echo "❌ Error: lambda-handler.js not found in dist/"
            echo "Make sure lambda-handler.ts is compiled"
            exit 1
          fi
          
          # Verify bcryptjs exists before packaging (no native compilation needed)
          echo "Pre-package verification:"
          if [ -d "node_modules/bcryptjs" ]; then
            echo "✅ bcryptjs found (JavaScript implementation, no native compilation needed)"
            ls -la node_modules/bcryptjs/ | head -5
          else
            echo "⚠️  Warning: bcryptjs not found, but continuing..."
          fi
          
          # Create a clean package directory
          rm -rf lambda-package
          mkdir -p lambda-package
          
          # Copy compiled JavaScript files
          echo "Copying compiled files..."
          cp -r dist/* lambda-package/
          
          # Copy node_modules with proper handling of symlinks
          echo "Copying node_modules (this may take a while)..."
          # Use rsync if available, otherwise use cp with proper flags
          if command -v rsync &> /dev/null; then
            echo "Using rsync to copy node_modules..."
            rsync -av --copy-links --no-perms node_modules/ lambda-package/node_modules/
          else
            echo "Using cp to copy node_modules..."
            # Use cp with -L to follow symlinks and -R for recursive
            cp -RL node_modules lambda-package/
          fi
          
          # Verify bcryptjs was copied correctly
          echo "Verifying bcryptjs in package directory:"
          if [ -d "lambda-package/node_modules/bcryptjs" ]; then
            echo "✅ bcryptjs copied successfully"
            ls -la lambda-package/node_modules/bcryptjs/ | head -5
          else
            echo "⚠️  Warning: bcryptjs not found in package, but continuing..."
          fi
          
          # Copy package.json for Lambda runtime
          cp package.json lambda-package/
          
          # Create zip file with all files (including hidden files)
          echo "Creating ZIP package..."
          cd lambda-package
          # Use zip with -r for recursive and ensure all files are included
          # -y: store symlinks as the link (not the referenced file)
          # -q: quiet mode
          zip -ry ../lambda-deployment.zip . -q
          
          # Verify bcryptjs is in the ZIP (no native files needed)
          echo "Verifying bcryptjs in ZIP..."
          if unzip -l ../lambda-deployment.zip | grep -q "bcryptjs"; then
            echo "✅ bcryptjs found in ZIP"
            unzip -l ../lambda-deployment.zip | grep bcryptjs | head -3
          else
            echo "⚠️  Warning: bcryptjs not found in ZIP, but this may be OK if it's in a subdirectory"
          fi
          cd ..
          
          echo "Package created. Size:"
          ls -lh lambda-deployment.zip
          
          # Verify handler exists in package
          echo "Verifying handler in package:"
          if unzip -l lambda-deployment.zip | grep -q "lambda-handler.js"; then
            echo "✅ lambda-handler.js found in ZIP"
          else
            echo "❌ ERROR: lambda-handler.js NOT FOUND in ZIP"
            exit 1
          fi
          
          # Verify bcryptjs is included in ZIP (JavaScript implementation, no native files)
          echo "Verifying bcryptjs in ZIP:"
          if unzip -l lambda-deployment.zip | grep -q "bcryptjs"; then
            echo "✅ bcryptjs found in ZIP (JavaScript implementation, no native compilation needed)"
            unzip -l lambda-deployment.zip | grep bcryptjs | head -5
          else
            echo "⚠️  Warning: bcryptjs not found in ZIP listing, but this may be OK"
          fi
          
          # Verify all native modules are included
          echo "Verifying all native modules in ZIP:"
          native_in_zip=$(unzip -l lambda-deployment.zip | grep "\.node$" | wc -l)
          echo "  Found $native_in_zip native module(s) in ZIP"
          if [ "$native_in_zip" -gt 0 ]; then
            echo "  Native modules in ZIP:"
            unzip -l lambda-deployment.zip | grep "\.node$" | head -10
          fi
          
          # Show package contents (first 30 files)
          echo "Package contents (first 30 files):"
          unzip -l lambda-deployment.zip | head -30

      - name: Upload package to S3 (for Lambda deployment)
        id: upload-s3
        run: |
          PACKAGE_PATH="${{ steps.backend-path.outputs.path }}/lambda-deployment.zip"
          S3_KEY="lambda-deployments/backend-$(date +%Y%m%d-%H%M%S).zip"
          
          echo "Uploading package to S3..."
          echo "Bucket: ${{ secrets.S3_BUCKET_NAME }}"
          echo "Key: $S3_KEY"
          
          aws s3 cp "$PACKAGE_PATH" \
            "s3://${{ secrets.S3_BUCKET_NAME }}/$S3_KEY" \
            --region "${{ steps.aws-config.outputs.region }}"
          
          # Set both as output and environment variable for compatibility
          echo "s3-key=$S3_KEY" >> $GITHUB_OUTPUT
          echo "s3-key=$S3_KEY" >> $GITHUB_ENV
          echo "✅ Package uploaded to S3"

      - name: Update Lambda function code
        run: |
          S3_KEY="${{ steps.upload-s3.outputs.s3-key }}"
          
          if [ -z "$S3_KEY" ]; then
            echo "❌ Error: S3_KEY is empty. Cannot update Lambda function."
            exit 1
          fi
          
          echo "Updating Lambda function: ${{ secrets.LAMBDA_FUNCTION_NAME }}"
          echo "Using S3 key: $S3_KEY"
          
          # Update Lambda function code from S3
          aws lambda update-function-code \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --s3-bucket "${{ secrets.S3_BUCKET_NAME }}" \
            --s3-key "$S3_KEY" \
            --region "${{ steps.aws-config.outputs.region }}"
          
          echo "✅ Lambda function code updated"

      - name: Wait for Lambda update to complete
        run: |
          echo "Waiting for Lambda function update to complete..."
          aws lambda wait function-updated \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --region "${{ steps.aws-config.outputs.region }}"
          
          echo "✅ Lambda function update completed"

      - name: Get Lambda function info
        id: lambda-info
        run: |
          echo "Lambda function information:"
          aws lambda get-function \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --region "${{ steps.aws-config.outputs.region }}" \
            --query 'Configuration.[FunctionName,LastModified,Runtime,CodeSize,MemorySize,Timeout,Handler]' \
            --output table
          
          # Extract handler for validation
          HANDLER=$(aws lambda get-function-configuration \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --region "${{ steps.aws-config.outputs.region }}" \
            --query 'Handler' \
            --output text)
          
          # Extract runtime for validation
          RUNTIME=$(aws lambda get-function-configuration \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --region "${{ steps.aws-config.outputs.region }}" \
            --query 'Runtime' \
            --output text)
          
          echo "handler=$HANDLER" >> $GITHUB_OUTPUT
          echo "runtime=$RUNTIME" >> $GITHUB_OUTPUT
          echo ""
          echo "Current handler: $HANDLER"
          echo "Current runtime: $RUNTIME"
          
          # Warn if runtime doesn't match Node.js 24
          if [[ ! "$RUNTIME" =~ nodejs24 ]]; then
            echo ""
            echo "⚠️  WARNING: Lambda runtime is $RUNTIME, but we compiled with Node.js 24"
            echo "   Native modules (like bcrypt) may have compatibility issues"
            echo "   Recommended: Set Lambda runtime to nodejs24.x"
            echo "   Location: Lambda Console > Configuration > Runtime settings > Edit"
          else
            echo ""
            echo "✅ Lambda runtime matches compilation environment: $RUNTIME"
          fi

      - name: Validate Lambda configuration
        run: |
          HANDLER="${{ steps.lambda-info.outputs.handler }}"
          EXPECTED_HANDLER="lambda-handler.handler"
          
          echo "🔍 Validating Lambda configuration..."
          echo "Expected handler: $EXPECTED_HANDLER"
          echo "Current handler:  $HANDLER"
          echo ""
          
          # Validate handler
          if [ "$HANDLER" != "$EXPECTED_HANDLER" ]; then
            echo "❌ ERROR: Handler configuration is incorrect!"
            echo ""
            echo "Current handler:  $HANDLER"
            echo "Expected handler: $EXPECTED_HANDLER"
            echo ""
            echo "📝 To fix this:"
            echo "1. Go to AWS Lambda Console"
            echo "2. Select function: ${{ secrets.LAMBDA_FUNCTION_NAME }}"
            echo "3. Go to: Configuration > Runtime settings"
            echo "4. Click 'Edit'"
            echo "5. Change Handler to: lambda-handler.handler"
            echo "6. Click 'Save'"
            echo ""
            echo "⚠️  The deployment was successful, but the function may not work correctly"
            echo "    until the handler is updated."
            exit 1
          else
            echo "✅ Handler configuration is correct: $HANDLER"
          fi
          
          echo ""
          echo "✅ Deployment completed successfully"
          echo ""
          echo "📝 Lambda function configuration:"
          echo "   ✅ Handler: $HANDLER"
          echo "   📋 Runtime: Node.js 24.x (compiled with Node.js 24)"
          echo "   ⚙️  Environment variables: Verify all required vars are set (DB_HOST, JWT_SECRET, etc.)"
          echo "   🌐 VPC: Configure if database is in VPC"
          echo "   ⏱️  Timeout: At least 30 seconds (recommended: 60+ seconds)"
          echo "   💾 Memory: At least 512 MB (recommended: 1024 MB)"
          echo ""
          echo "⚠️  Note: Socket.IO will NOT work in Lambda. Only HTTP/API routes are available."
