name: Deploy Frontend to S3

on:
  push:
    tags:
      - 'v-frontend*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - List repository structure
        run: |
          echo "Current directory:"
          pwd
          echo "Repository contents:"
          ls -la
          echo "Checking for frontend folder:"
          if [ -d "inicio/frontend" ]; then
            echo "Found: inicio/frontend"
            ls -la inicio/frontend/
          elif [ -d "frontend" ]; then
            echo "Found: frontend (in root)"
            ls -la frontend/
          else
            echo "Frontend folder not found in expected locations"
            find . -name "frontend" -type d 2>/dev/null | head -5
          fi

      - name: Prepare frontend files for deployment
        run: |
          # Determine frontend path
          if [ -d "inicio/frontend" ]; then
            FRONTEND_DIR="inicio/frontend"
            BUILD_DIR="inicio/build-frontend"
          elif [ -d "frontend" ]; then
            FRONTEND_DIR="frontend"
            BUILD_DIR="build-frontend"
          else
            echo "Error: Frontend directory not found"
            exit 1
          fi
          
          echo "Using frontend directory: $FRONTEND_DIR"
          echo "Build directory: $BUILD_DIR"
          
          # Create build directory
          mkdir -p "$BUILD_DIR"
          
          # Copy static files (verify they exist first)
          if [ -d "$FRONTEND_DIR/css" ]; then
            cp -r "$FRONTEND_DIR/css" "$BUILD_DIR/"
            echo "✓ Copied css/"
          else
            echo "Warning: css/ directory not found"
          fi
          
          if [ -d "$FRONTEND_DIR/js" ]; then
            cp -r "$FRONTEND_DIR/js" "$BUILD_DIR/"
            echo "✓ Copied js/"
          else
            echo "Warning: js/ directory not found"
          fi
          
          if [ -f "$FRONTEND_DIR/index.html" ]; then
            cp "$FRONTEND_DIR/index.html" "$BUILD_DIR/"
            echo "✓ Copied index.html"
          else
            echo "Error: index.html not found"
            exit 1
          fi
          
          # Copy package.json if it exists
          if [ -f "$FRONTEND_DIR/package.json" ]; then
            cp "$FRONTEND_DIR/package.json" "$BUILD_DIR/" 2>/dev/null || true
            echo "✓ Copied package.json"
          fi
          
          echo "Build directory contents:"
          ls -la "$BUILD_DIR"

      - name: Validate AWS secrets and set defaults
        id: aws-config
        run: |
          # Validate required secrets
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "❌ Error: AWS_ACCESS_KEY_ID secret is not configured"
            echo "Please add it in: Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "❌ Error: AWS_SECRET_ACCESS_KEY secret is not configured"
            echo "Please add it in: Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -z "${{ secrets.S3_BUCKET_NAME }}" ]; then
            echo "❌ Error: S3_BUCKET_NAME secret is not configured"
            echo "Please add it in: Settings > Secrets and variables > Actions"
            exit 1
          fi
          
          # Set default region if not provided
          if [ -z "${{ secrets.AWS_REGION }}" ]; then
            echo "⚠️  Warning: AWS_REGION secret is not configured, using default: us-east-1"
            echo "You can override this by setting AWS_REGION secret in: Settings > Secrets and variables > Actions"
            echo "region=us-east-1" >> $GITHUB_OUTPUT
          else
            echo "✅ Using AWS_REGION from secrets: ${{ secrets.AWS_REGION }}"
            echo "region=${{ secrets.AWS_REGION }}" >> $GITHUB_OUTPUT
          fi
          
          echo "✅ All required AWS secrets are configured"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.aws-config.outputs.region }}

      - name: Determine build directory path
        id: build-dir
        run: |
          if [ -d "inicio/build-frontend" ]; then
            echo "path=inicio/build-frontend" >> $GITHUB_OUTPUT
          elif [ -d "build-frontend" ]; then
            echo "path=build-frontend" >> $GITHUB_OUTPUT
          else
            echo "Error: Build directory not found"
            exit 1
          fi

      - name: Deploy to S3 bucket
        run: |
          echo "Deploying from: ${{ steps.build-dir.outputs.path }}"
          echo "To bucket: ${{ secrets.S3_BUCKET_NAME }}"
          echo "Region: ${{ steps.aws-config.outputs.region }}"
          
          # Sync files to S3 without ACLs (using bucket policies instead)
          aws s3 sync "${{ steps.build-dir.outputs.path }}" \
            "s3://${{ secrets.S3_BUCKET_NAME }}" \
            --region "${{ steps.aws-config.outputs.region }}" \
            --delete \
            --no-progress \
            --exact-timestamps
          
          echo "✅ Deployment completed successfully"