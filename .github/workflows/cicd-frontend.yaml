name: Deploy Frontend to S3

on:
  push:
    tags:
      - 'v-frontend*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (if a frontend build is needed )
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build project
        run: |
          npm install
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3 bucket
        uses: reggionick/s3-deploy@v4
        with:
          folder: build # The directory containing your built static files (e.g., dist, public)
          bucket: ${{ secrets.S3_BUCKET_NAME }}
          bucket-region: ${{ secrets.AWS_REGION }}
          delete-removed: true # Removes files in S3 that are no longer in the local copy
          no-cache: true